<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="js/config.js"></script>
        <script src="js/head.js"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
        <script src="https://cdn.datatables.net/1.10.20/js/jquery.dataTables.min.js" crossorigin="anonymous" defer></script>
        <script src="https://cdn.datatables.net/1.10.20/js/dataTables.bootstrap4.min.js" crossorigin="anonymous" defer></script>
		<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
    	<script src="js/script.js" defer></script>
		<script src="js/page-loader.js" defer></script>
    </head>
    <body class="sb-nav-fixed">
        <div data-include="components/navigation-top.html"></div>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav" data-include="components/navigation-left.html"></div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid">
                        <h1 class="mt-4">Voucher</h1>
                        <div class="card mb-4">
                            <div class="card-body">
                                <div class="table-responsive">
									<button class="btn btn-dt-top btn-secondary btn-success" data-toggle="modal" data-target="#voucher-upload">Upload Voucher</button>
									<button class="btn btn-dt-top btn-secondary btn-info" id="voucher-download">Download Voucher (XLSX)</button>
									<div class="row mx-0"><div class="col-md-3 col-sm-4 mb-3 px-0">
										<select id="voucher-filter" class="form-control border-primary bg-light">
											<option value="" selected>Filter: Show All</option>
											<option value="claimed">Filter: Claimed</option>
											<option value="available">Filter: Available</option>
											<option value="expired">Filter: Expired</option>
										</select>
                          			</div></div>
                                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                        <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>ID</th>
                                                <th>Code</th>
                                                <th>Description</th>
                                                <th>Expired Time</th>
                                                <th>Player</th>
                                                <th>Claimed Time</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
                
            </div>
        </div>

        <div class="overlay">
			<img src="img/loading-circle.gif"/>
		</div>
       
<div class="modal fade" id="voucher-upload" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Upload Voucher</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
				  <span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="alert alert-danger alert-message"></div>
				<div class="form-group row">
					<label class="col-sm-3 col-form-label">File (XLSX) *</label>
					<div class="col-sm-9 input-file-container">
						<input type="file" class="form-control-file input-file" placeholder="File (XLSX)">						
					</div>
					<div class="col-sm-9 offset-sm-3">
						<div class="mt-4">Download the <a href="files/voucher_template.xlsx" target="_blank">Voucher Template</a></div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<input type="hidden" class="input-id">
				<button type="button" class="btn btn-primary submit-upload">Submit</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="voucher-delete" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Delete Voucher</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
				  <span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
                <div class="alert alert-danger alert-message"></div>
                <p>Delete the following voucher?</p>

				<table class="table table-striped table-responsive-sm">
					<tbody>
						<tr>
							<th scope="row">Link</th>
							<td class="delete-link"></td>
						</tr>
						<tr>
							<th scope="row">Code</th>
							<td class="delete-code"></td>
						</tr>
						<tr>
							<th scope="row">Description</th>
							<td class="delete-description"></td>
						</tr>
						<tr>
							<th scope="row">Expired Time</th>
							<td class="delete-expired"></td>
						</tr>
						<tr>
							<th scope="row">Player</th>
							<td class="delete-player"></td>
						</tr>
						<tr>
							<th scope="row">Claimed Time</th>
							<td class="delete-claimed"></td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="modal-footer">	
                <input type="hidden" class="input-id">
				<button type="button" class="btn btn-danger submit-delete">Delete</button>			
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="password-edit" tabindex="-1" role="dialog">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Change Password</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
				  <span aria-hidden="true">&times;</span>
				</button>
			</div>
			<form autocomplete=off>
			<div class="modal-body">				
				<div class="alert alert-danger alert-message"></div>
				<div class="form-group row">
					<label class="col-sm-5 col-form-label">Current Password *</label>
					<div class="col-sm-7">
						<input type="password" class="form-control input-password-current" placeholder="Current Password">
					</div>
				</div>
				<div class="form-group row">
					<label class="col-sm-5 col-form-label">New Password *</label>
					<div class="col-sm-7">
						<input type="password" class="form-control input-password" placeholder="New Password">
					</div>
				</div>
				<div class="form-group row">
					<label class="col-sm-5 col-form-label">Confirm Password *</label>
					<div class="col-sm-7">
						<input type="password" class="form-control input-password-2" placeholder="Confirm Password">
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary submit-password">Submit</button>
			</div>
			</form>
		</div>
	</div>
</div>
        
    </body>
</html>
