<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="js/config.js"></script>
        <script src="js/head.js"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous" defer></script>
        <script src="https://cdn.datatables.net/1.10.20/js/jquery.dataTables.min.js" crossorigin="anonymous" defer></script>
        <script src="https://cdn.datatables.net/1.10.20/js/dataTables.bootstrap4.min.js" crossorigin="anonymous" defer></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
    	<script src="js/script.js" defer></script>
        <script src="js/page-loader.js" defer></script>
    </head>
    <body class="sb-nav-fixed">
        <div data-include="components/navigation-top.html"></div>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav" data-include="components/navigation-left.html"></div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid">                        
						<div class="d-flex">
							<div class="flex-grow-1">
								<h1 class="mt-4">Coupon: List</h1>
							</div>
							<div class="ml-1 align-self-end">
								<a href="coupon-player.html" class="btn btn-dt-top btn-primary mb-3 mr-0">Player Redeemed</a>
							</div>
						</div>
                        <div class="card mb-4">
                            <div class="card-body">
                                <div class="table-responsive">
									<button class="btn btn-dt-top btn-secondary btn-success" data-toggle="modal" data-target="#coupon-add">New Coupon</button>
									<div class="row mx-0 d-none"><div class="col-md-3 col-sm-4 mb-3 px-0">
										<select id="config-filter" class="form-control">
											<option value="" selected>Filter: Show All</option>
											<option value="activities">Filter: Activities</option>
											<option value="dailyreward">Filter: Daily Reward</option>
											<option value="outletstores">Filter: Outlet Stores</option>
											<option value="pet">Filter: Pet</option>
											<option value="premiummenu">Filter: Premium Menu</option>
											<option value="activetools">Filter: Active Tools</option>
											<option value="supporttools">Filter: Support Tools</option>
										</select>
                          			</div></div>
									<table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                                        <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>ID</th>
                                                <th>Code</th>
                                                <th>Description</th>
                                                <th>Reward</th>
                                                <th>Status</th>
                                                <th></th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
                
            </div>
        </div>

        <div class="overlay">
			<img src="img/loading-circle.gif"/>
		</div>
       
<div class="modal fade" id="coupon-add" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">New Coupon</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="alert alert-danger alert-message"></div>
				<div class="form-group row">
					<label class="col-sm-3 col-form-label">Code *</label>
					<div class="col-sm-9">
						<input type="text" class="form-control input-code w-50" placeholder="Code">
					</div>
				</div>
				<div class="form-group row">
					<label class="col-sm-3 col-form-label">Description *</label>
					<div class="col-sm-9">
						<input type="text" class="form-control input-description" placeholder="Description">
					</div>
				</div>
                <div class="form-group row">
					<label class="col-sm-3 col-form-label">Reward *</label>
					<div class="col-sm-9">
                        <div class="input-object-container">
                            <div class="form-inline mb-2">
                                <!-- 
                                <select class="form-control input-object-key w-auto mr-2">
                                    <option value="">Select Ingredient</option>
                                    <option value="key1">Ingredient 1</option>
                                    <option value="key2">Ingredient 2</option>
                                </select>
                                <input type="text" class="form-control input-object-value w-25" placeholder="Value">
                                -->
                            </div>
                        </div>
                        <button type="button" class="btn btn-success btn-sm btn-add">
                            + Add Item
                        </button>
					</div>                    
				</div>
                <div class="form-group row">
					<label class="col-sm-3 col-form-label">Status *</label>
					<div class="col-sm-9">
						<div class="form-check">
							<input class="form-check-input input-status" type="radio" name="input-status" value="true" checked="checked">
							<label class="form-check-label">
								Active
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input input-status" type="radio" name="input-status" value="false">
							<label class="form-check-label">
								Inactive
							</label>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<input type="hidden" class="input-id">
				<button type="button" class="btn btn-primary submit-add" value="string">Submit</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="coupon-edit" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Edit Coupon</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<div class="alert alert-danger alert-message"></div>
				<div class="form-group row">
					<label class="col-sm-3 col-form-label">Code *</label>
					<div class="col-sm-9">
						<input type="text" class="form-control input-code w-50" placeholder="Code">
					</div>
				</div>
				<div class="form-group row">
					<label class="col-sm-3 col-form-label">Description *</label>
					<div class="col-sm-9">
						<input type="text" class="form-control input-description" placeholder="Description">
					</div>
				</div>
                <div class="form-group row">
					<label class="col-sm-3 col-form-label">Reward *</label>
					<div class="col-sm-9">
                        <div class="input-object-container">
                            <div class="form-inline mb-2">
                                <!-- 
                                <select class="form-control input-object-key w-auto mr-2">
                                    <option value="">Select Ingredient</option>
                                    <option value="key1">Ingredient 1</option>
                                    <option value="key2">Ingredient 2</option>
                                </select>
                                <input type="text" class="form-control input-object-value w-25" placeholder="Value">
                                -->
                            </div>
                        </div>
                        <button type="button" class="btn btn-success btn-sm btn-add">
                            + Add Item
                        </button>
					</div>                    
				</div>
                <div class="form-group row">
					<label class="col-sm-3 col-form-label">Status *</label>
					<div class="col-sm-9">
						<div class="form-check">
							<input class="form-check-input input-status" type="radio" name="input-status-edit" value="true" checked>
							<label class="form-check-label">
								Active
							</label>
						</div>
						<div class="form-check">
							<input class="form-check-input input-status" type="radio" name="input-status-edit" value="false">
							<label class="form-check-label">
								Inactive
							</label>
						</div>
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<input type="hidden" class="input-id">
				<button type="button" class="btn btn-primary submit-edit" value="string">Submit</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="coupon-delete" tabindex="-1" role="dialog">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Delete Coupon</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
				  <span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
                <div class="alert alert-danger alert-message"></div>
                <p>Delete the following coupon?</p>

				<table class="table table-striped table-responsive-sm">
					<tbody>
						<tr>
							<th scope="row">Code</th>
							<td class="delete-code"></td>
						</tr>
						<tr>
							<th scope="row">Description</th>
							<td class="delete-description"></td>
						</tr>
						<tr>
							<th scope="row">Reward</th>
							<td class="delete-reward"></td>
						</tr>
						<tr>
							<th scope="row">Status</th>
							<td class="delete-status"></td>
						</tr>
					</tbody>
				</table>
			</div>
			<div class="modal-footer">	
                <input type="hidden" class="input-id">
				<button type="button" class="btn btn-danger submit-delete">Delete</button>			
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="password-edit" tabindex="-1" role="dialog">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Change Password</h5>
				<button type="button" class="close" data-dismiss="modal" aria-label="Close">
				  <span aria-hidden="true">&times;</span>
				</button>
			</div>
			<form autocomplete=off>
			<div class="modal-body">				
				<div class="alert alert-danger alert-message"></div>
				<div class="form-group row">
					<label class="col-sm-5 col-form-label">Current Password *</label>
					<div class="col-sm-7">
						<input type="password" class="form-control input-password-current" placeholder="Current Password">
					</div>
				</div>
				<div class="form-group row">
					<label class="col-sm-5 col-form-label">New Password *</label>
					<div class="col-sm-7">
						<input type="password" class="form-control input-password" placeholder="New Password">
					</div>
				</div>
				<div class="form-group row">
					<label class="col-sm-5 col-form-label">Confirm Password *</label>
					<div class="col-sm-7">
						<input type="password" class="form-control input-password-2" placeholder="Confirm Password">
					</div>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-primary submit-password">Submit</button>
			</div>
			</form>
		</div>
	</div>
</div>
        
    </body>
</html>
