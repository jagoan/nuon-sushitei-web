<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="js/config.js"></script>
        <script src="js/head.js"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.bundle.min.js" crossorigin="anonymous" defer></script>
    	<script src="js/script.js" defer></script>
        <script src="js/page-loader.js" defer></script>
    </head>
    <body class="bg-secondary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-5">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">Login</h3></div>
                                    <div class="card-body">
                                        <div class='alert alert-message alert-danger'></div>
                                        <form role="form" autocomplete="off">
                                            <div class="form-group">
                                                <label class="mb-1" for="inputUsername">Username</label>
                                                <input class="form-control py-4 input-username" id="inputUsername" type="text" placeholder="Username"/>
                                            </div>
                                            <div class="form-group">
                                                <label class="mb-1" for="inputPassword">Password</label>
                                                <input class="form-control py-4 input-password" id="inputPassword" type="password" placeholder="Password"/>
                                            </div>
                                            <div class="form-group d-flex align-items-center justify-content-between mt-4 mb-0">
                                                <!-- <a href="password.html">Lupa password?</a> -->
                                                <span class="btn btn-primary submit-login">Login</span>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutAuthentication_footer" data-include="components/footer.html"></div>
        </div>

        <div class="overlay"><img src="img/loading-circle.gif"/></div>
        
    </body>
</html>
